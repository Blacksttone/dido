<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dido — Free AI Chat</title>
<meta name="description" content="Dido is a free AI chat assistant. The model runs in your browser — no account, no subscription, no API key.">
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --side: #ececf1; --text: #1f2328; --muted: #6b7280;
    --border: #d9dce1; --accent: #6d4aff; --accent-text: #fff; --user: #e8e3ff; --code: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --panel: #1f2026; --side: #121317; --text: #e8e9ec; --muted: #9aa0aa;
      --border: #30323a; --accent: #8b6cff; --accent-text: #fff; --user: #2c2645; --code: #2a2c33;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, textarea { font: inherit; color: inherit; }
  .app { display: flex; height: 100%; }
  aside { width: 260px; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .brand { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .brand span { background: var(--accent); color: var(--accent-text); border-radius: 8px;
    width: 30px; height: 30px; display: grid; place-items: center; }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 9px 12px; cursor: pointer; text-align: left; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); text-align: center; }
  .chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .chat-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .chat-item:hover, .chat-item.active { background: var(--panel); }
  .chat-item .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-item .x { opacity: .5; border: 0; background: none; cursor: pointer; }
  .chat-item .x:hover { opacity: 1; }
  label.small { font-size: 12px; color: var(--muted); }
  select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
  .free { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: none; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 100%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); max-width: 85%; white-space: pre-wrap; }
  .msg.assistant .bubble { background: transparent; padding-left: 0; }
  .bubble pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
  .bubble pre code { padding: 0; background: none; }
  .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .empty { text-align: center; margin-top: 12vh; color: var(--muted); }
  .empty h1 { color: var(--text); font-size: 30px; margin: 0 0 8px; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 24px; }
  #status { max-width: 780px; margin: 0 auto 8px; font-size: 13px; color: var(--muted); padding: 0 16px; }
  .bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  form { padding: 0 16px 16px; }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 8px; }
  textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; max-height: 200px; padding: 6px; }
  #send { border: 0; background: var(--accent); color: var(--accent-text); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    header { display: flex; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span>D</span> Dido</div>
    <button class="btn primary" id="newChat">+ New chat</button>
    <div class="chats" id="chats"></div>
    <div>
      <label class="small" for="model">Model (runs on your device)</label>
      <select id="model"></select>
    </div>
    <button class="btn" id="clearAll">Delete all chats</button>
    <div class="free">100% free · no login · no subscription. Your chats stay in this browser.</div>
  </aside>
  <main>
    <header><button class="btn" id="menu" aria-label="Menu">☰</button><b>Dido</b></header>
    <div id="messages"><div class="wrap" id="list"></div></div>
    <div id="status"></div>
    <form id="form">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Dido…"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <div class="note">The first message downloads the model once (cached afterwards). Needs a browser with WebGPU (Chrome / Edge).</div>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";

const MODELS = [
  ["Qwen2.5-1.5B-Instruct-q4f16_1-MLC", "Qwen 2.5 1.5B — fast (≈1 GB)"],
  ["Llama-3.2-1B-Instruct-q4f16_1-MLC", "Llama 3.2 1B — fastest (≈0.9 GB)"],
  ["Llama-3.2-3B-Instruct-q4f16_1-MLC", "Llama 3.2 3B — smarter (≈2.3 GB)"],
  ["Phi-3.5-mini-instruct-q4f16_1-MLC", "Phi 3.5 mini — smart (≈3.7 GB)"],
  ["Qwen2.5-7B-Instruct-q4f16_1-MLC", "Qwen 2.5 7B — best (≈5 GB)"],
];
const SYSTEM = "You are Dido, a friendly and helpful AI assistant. Answer clearly and concisely. Use markdown when helpful.";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let chats = store.get("dido.chats", []);
let currentId = store.get("dido.current", null);
let engine = null, loadedModel = null, busy = false;

const modelSel = $("model");
for (const [id, label] of MODELS) modelSel.add(new Option(label, id));
modelSel.value = store.get("dido.model", MODELS[0][0]);
modelSel.onchange = () => store.set("dido.model", modelSel.value);

const save = () => { store.set("dido.chats", chats); store.set("dido.current", currentId); };
const current = () => chats.find(c => c.id === currentId);
const md = t => DOMPurify.sanitize(marked.parse(t || ""));

function newChat() {
  const c = { id: Date.now().toString(36), title: "New chat", messages: [] };
  chats.unshift(c); currentId = c.id; save(); render();
}

function renderSidebar() {
  const box = $("chats"); box.innerHTML = "";
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat-item" + (c.id === currentId ? " active" : "");
    const t = document.createElement("span"); t.className = "t"; t.textContent = c.title;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.title = "Delete";
    x.onclick = e => { e.stopPropagation(); chats = chats.filter(k => k.id !== c.id);
      if (currentId === c.id) currentId = chats[0]?.id ?? null; save(); render(); };
    el.onclick = () => { currentId = c.id; save(); render(); $("side").classList.remove("open"); };
    el.append(t, x); box.append(el);
  }
}

function bubble(role, content) {
  const m = document.createElement("div"); m.className = "msg " + role;
  const b = document.createElement("div"); b.className = "bubble";
  if (role === "user") b.textContent = content; else b.innerHTML = md(content);
  m.append(b); $("list").append(m); return b;
}

function renderMessages() {
  const list = $("list"); list.innerHTML = "";
  const c = current();
  if (!c || !c.messages.length) {
    list.innerHTML = `<div class="empty"><h1>Hi, I'm Dido 👋</h1>
      <div>Free AI chat — runs privately on your device.</div><div class="suggest"></div></div>`;
    const s = list.querySelector(".suggest");
    for (const q of ["Explain quantum computing simply", "Write a short poem about Chennai rain",
                     "Help me plan a 3-day study schedule", "Write a Python function to reverse a string"]) {
      const b = document.createElement("button"); b.className = "btn"; b.textContent = q;
      b.onclick = () => { $("input").value = q; send(); }; s.append(b);
    }
    return;
  }
  for (const m of c.messages) bubble(m.role, m.content);
  scroll();
}

const scroll = () => { const m = $("messages"); m.scrollTop = m.scrollHeight; };
function render() { renderSidebar(); renderMessages(); }

function status(text, pct) {
  const s = $("status");
  if (!text) { s.innerHTML = ""; return; }
  s.innerHTML = `<div></div>` + (pct != null ? `<div class="bar"><div style="width:${pct}%"></div></div>` : "");
  s.firstChild.textContent = text;
}

async function ensureEngine() {
  if (engine && loadedModel === modelSel.value) return engine;
  if (!navigator.gpu) throw new Error("Your browser doesn't support WebGPU. Please use the latest Chrome or Edge on desktop or Android.");
  status("Loading model…", 0);
  const cb = p => status(p.text, Math.round((p.progress || 0) * 100));
  if (engine) await engine.reload(modelSel.value);
  else engine = await webllm.CreateMLCEngine(modelSel.value, { initProgressCallback: cb });
  loadedModel = modelSel.value; status("");
  return engine;
}

async function send() {
  const input = $("input"); const text = input.value.trim();
  if (!text || busy) return;
  if (!current()) newChat();
  const c = current();
  if (!c.messages.length) $("list").innerHTML = "";
  c.messages.push({ role: "user", content: text });
  if (c.title === "New chat") c.title = text.slice(0, 40);
  input.value = ""; autosize(); save(); renderSidebar();
  bubble("user", text);
  const out = bubble("assistant", "…"); scroll();
  busy = true; $("send").disabled = true;
  let reply = "";
  try {
    const eng = await ensureEngine();
    status("Thinking…");
    const stream = await eng.chat.completions.create({
      stream: true, temperature: 0.7,
      messages: [{ role: "system", content: SYSTEM }, ...c.messages.slice(-20)],
    });
    for await (const chunk of stream) {
      reply += chunk.choices[0]?.delta?.content || "";
      out.innerHTML = md(reply); scroll();
    }
    status("");
  } catch (err) {
    reply = reply || "⚠️ " + (err.message || err);
    out.innerHTML = md(reply); status("");
  }
  c.messages.push({ role: "assistant", content: reply }); save();
  busy = false; $("send").disabled = false; input.focus();
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("form").onsubmit = e => { e.preventDefault(); send(); };
$("newChat").onclick = () => { newChat(); $("side").classList.remove("open"); };
$("clearAll").onclick = () => { if (confirm("Delete all chats?")) { chats = []; currentId = null; save(); render(); } };
$("menu").onclick = () => $("side").classList.toggle("open");
render();
</script>
</body>
</html>
