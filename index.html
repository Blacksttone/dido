<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Dido — Free AI Chat</title>
<meta name="description" content="Dido is a free AI chat assistant. The AI runs on your own device: no login, no subscription, no API key.">
<meta name="theme-color" content="#6d4aff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dido">
<meta property="og:title" content="Dido — Free AI Chat">
<meta property="og:description" content="Free AI chat that runs on your device. No login, no subscription.">
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --side: #ececf1; --text: #1f2328; --muted: #6b7280;
    --border: #d9dce1; --accent: #6d4aff; --accent-text: #fff; --user: #e8e3ff; --code: #f1f2f4; --warn: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --panel: #1f2026; --side: #121317; --text: #e8e9ec; --muted: #9aa0aa;
      --border: #30323a; --accent: #8b6cff; --accent-text: #fff; --user: #2c2645; --code: #2a2c33; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, select, textarea { font: inherit; color: inherit; }
  .app { display: flex; height: 100%; height: 100dvh; }
  aside { width: 270px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px; gap: 10px; }
  .brand { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .brand img { width: 30px; height: 30px; }
  .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
    padding: 9px 12px; cursor: pointer; text-align: left; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); text-align: center; }
  .btn.link { border: 0; background: none; padding: 2px; color: var(--muted); font-size: 13px; }
  .btn.link:hover { color: var(--text); }
  .chats { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .chat-item:hover, .chat-item.active { background: var(--panel); }
  .chat-item .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-item .x { opacity: .5; border: 0; background: none; cursor: pointer; padding: 2px 4px; }
  .chat-item .x:hover { opacity: 1; }
  label.small { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); }
  select:disabled { opacity: .6; }
  .free { font-size: 12px; color: var(--muted); }
  .toggle { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: none; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  header b { flex: 1; font-size: 17px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .msg { margin: 0 0 18px; display: flex; flex-direction: column; align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .msg.error .bubble { color: var(--warn); }
  .bubble pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .bubble code { background: var(--code); padding: 1px 5px; border-radius: 5px; font-size: 13.5px; }
  .bubble pre code { padding: 0; background: none; }
  .bubble p:first-child { margin-top: 0; } .bubble p:last-child { margin-bottom: 0; }
  .bubble table { border-collapse: collapse; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; }
  .typing:empty::after, .typing > :last-child::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { display: flex; gap: 12px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .meta button { border: 0; background: none; padding: 2px 0; color: var(--muted); cursor: pointer; font-size: 12px; }
  .meta button:hover { color: var(--text); }
  .empty { text-align: center; margin-top: 9vh; color: var(--muted); }
  .empty img { width: 64px; height: 64px; }
  .empty h1 { color: var(--text); font-size: 28px; margin: 12px 0 6px; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 24px; }
  #status { width: 100%; max-width: 812px; margin: 0 auto; padding: 0 16px 8px; font-size: 13px; color: var(--muted); }
  #status:empty { display: none; }
  .bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  form { padding: 0 16px max(12px, env(safe-area-inset-bottom)); }
  .composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 8px; }
  .composer:focus-within { border-color: var(--accent); }
  textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent; max-height: 200px;
    padding: 6px; font-size: 16px; line-height: 1.4; }
  #send { min-width: 70px; border: 0; background: var(--accent); color: var(--accent-text); border-radius: 10px;
    padding: 8px 16px; cursor: pointer; }
  #send.stop { background: var(--text); color: var(--bg); }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .backdrop { display: none; }
  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; width: min(85vw, 300px);
      transform: translateX(-100%); transition: transform .2s; }
    aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    aside.open + .backdrop { display: block; position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.35); }
    header { display: flex; }
    #messages { padding: 16px 12px; }
    form { padding-left: 10px; padding-right: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><img src="icon.svg" alt=""> Dido</div>
    <button class="btn primary" id="newChat">+ New chat</button>
    <div class="chats" id="chats"></div>
    <div>
      <label class="small" for="model">AI model (runs on your device)</label>
      <select id="model"></select>
      <div class="free" id="modelHint" style="margin-top:4px"></div>
    </div>
    <label class="toggle"><input type="checkbox" id="gpu"> Use the GPU when possible (faster)</label>
    <button class="btn link" id="clearAll">🗑 Delete all chats</button>
    <button class="btn link" id="clearModels">💾 Free up space (delete downloaded models)</button>
    <div class="free">100% free · no login · no subscription. Your chats never leave this device.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main>
    <header>
      <button class="btn" id="menu" aria-label="Open menu">☰</button>
      <b>Dido</b>
      <button class="btn" id="newChat2" aria-label="New chat">+</button>
    </header>
    <div id="messages"><div class="wrap" id="list"></div></div>
    <div id="status" aria-live="polite"></div>
    <form id="form">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Dido…" aria-label="Message"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
      <div class="note" id="note">Your first message downloads the AI model once. After that it's saved on this device.</div>
    </form>
  </main>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module">
// The AI is llama.cpp compiled to WebAssembly (wllama). It uses the GPU through WebGPU when the
// device supports it and the CPU otherwise, so it runs on any phone or computer.
const ENGINE_URL = "./vendor/wllama/index.js";
const WASM_PATHS = { default: "vendor/wllama/wllama.wasm" };
// Slower build for older browsers/WebViews without JSPI or 64-bit memory (bundled, so it works offline too).
const COMPAT = { worker: "vendor/wllama-compat/wllama.js", wasm: "vendor/wllama-compat/wllama.wasm" };

const isApp = !!window.DidoNative;   // set by the Android app
const isPhone = isApp || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const N_CTX = isPhone ? 2048 : 4096;              // the AI's memory, in tokens
const HISTORY_BUDGET = Math.round(N_CTX * 0.5);   // how much chat history we send
const MAX_REPLY = Math.round(N_CTX * 0.4);        // longest reply

// Each model lists several download sources (Hugging Face repos); the first one that works is used.
const MODELS = [
  { id: "qwen3-1.7b", name: "Qwen3 1.7B", label: "Qwen3 1.7B · 1.1 GB", qwen3: true,
    hint: "Recommended. Good answers and understands Tamil.",
    sources: [{ repo: "unsloth/Qwen3-1.7B-GGUF", quant: "Q4_K_M" }, { repo: "ggml-org/Qwen3-1.7B-GGUF", quant: "Q4_K_M" },
              { repo: "Qwen/Qwen3-1.7B-GGUF" }] },
  { id: "qwen3-0.6b", name: "Qwen3 0.6B", label: "Qwen3 0.6B · 0.4 GB", qwen3: true,
    hint: "Fastest and smallest. Simpler answers.",
    sources: [{ repo: "unsloth/Qwen3-0.6B-GGUF", quant: "Q4_K_M" }, { repo: "ggml-org/Qwen3-0.6B-GGUF", quant: "Q4_K_M" },
              { repo: "Qwen/Qwen3-0.6B-GGUF" }] },
  { id: "qwen2.5-1.5b", name: "Qwen 2.5 1.5B", label: "Qwen 2.5 1.5B · 1.1 GB",
    hint: "Older alternative, mostly English.",
    sources: [{ repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF", quant: "Q4_K_M" }] },
];
const SYSTEM = "You are Dido, a friendly and helpful AI assistant. Answer clearly and concisely. " +
  "Reply in the same language the user writes in; if they write Tamil or another language in English letters, reply the same way. " +
  "Use markdown when it helps.";

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let chats = store.get("dido.chats", []);
if (!Array.isArray(chats)) chats = [];
chats = chats.filter(c => c && Array.isArray(c.messages) && c.messages.length);
let currentId = store.get("dido.current", null);
let busy = false, stopRequested = false, live = null, abortCtl = null, loadAbort = null;
let lib = null, cacheMgr = null, llm = null, llmModel = null, onGPU = false;
let engineKey = null, enginePromise = null, loadChain = Promise.resolve(), loading = 0;

// ---------- markdown ----------
if (window.marked) marked.use({ gfm: true, breaks: true });
if (window.DOMPurify) DOMPurify.addHook("afterSanitizeAttributes", n => {
  if (n.tagName === "A") { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); }
});
const esc = s => s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const md = t => window.marked && window.DOMPurify
  ? DOMPurify.sanitize(marked.parse(t || "")) : esc(t || "").replace(/\n/g, "<br>");
// Qwen3 can "think" in <think> tags before answering; hide that part.
const visible = t => t.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");

// ---------- settings ----------
const modelSel = $("model"), gpuBox = $("gpu");
for (const m of MODELS) modelSel.add(new Option(m.label, m.id));
modelSel.value = store.get("dido.model", MODELS[0].id);
if (!modelSel.value) modelSel.value = MODELS[0].id;
gpuBox.checked = store.get("dido.gpu", true);
const currentModel = () => MODELS.find(m => m.id === modelSel.value) || MODELS[0];
const wantedKey = () => modelSel.value + (gpuBox.checked ? ":gpu" : ":cpu");
function showHint() {
  const m = currentModel();
  let where = "";
  if (llm && llmModel === m.id) where = onGPU ? " Running on the GPU ⚡" : " Running on the CPU.";
  $("modelHint").textContent = m.hint + where;
}
modelSel.onchange = () => {
  store.set("dido.model", modelSel.value); showHint();
  if (llm) status("The new model will load when you send your next message.");
  preloadIfCached();
};
gpuBox.onchange = () => {
  store.set("dido.gpu", gpuBox.checked);
  if (llm) status("This takes effect with your next message.");
  preloadIfCached();
};
if (isApp) $("note").textContent = "Your first message downloads the AI model once (needs internet). After that Dido works offline.";

// ---------- AI engine ----------
async function loadLib() {
  if (lib) return lib;
  if (typeof WebAssembly !== "object") throw new Error("NO_WASM");
  lib = await import(ENGINE_URL);
  return lib;
}

// Stores downloaded models in the Origin Private File System, or in the Cache API where that's missing.
class CacheApiStore {
  isSupported() { return typeof caches !== "undefined"; }
  key(k) { return "https://dido-models.local/" + encodeURIComponent(k); }
  box() { return caches.open("dido-models"); }
  async read(k) { const r = await (await this.box()).match(this.key(k)); return r ? r.blob() : null; }
  async write(k, stream) { await (await this.box()).put(this.key(k), new Response(stream)); }
  async getSize(k) { const r = await (await this.box()).match(this.key(k)); return r ? (await r.blob()).size : -1; }
  async list() {
    const box = await this.box(), out = [];
    for (const req of await box.keys()) {
      const r = await box.match(req);
      out.push({ key: decodeURIComponent(req.url.split("/").pop()), size: r ? (await r.blob()).size : 0 });
    }
    return out;
  }
  async delete(k) { await (await this.box()).delete(this.key(k)); }
}
function getCacheManager() {
  if (!cacheMgr) {
    try { cacheMgr = new lib.CacheManager(); }
    catch { cacheMgr = new lib.CacheManager([new CacheApiStore()]); }
  }
  return cacheMgr;
}

// Find the model file on Hugging Face (remembered afterwards, so a saved model also loads offline).
async function resolveModelUrl(model) {
  const saved = store.get("dido.url." + model.id, null);
  if (saved) return saved;
  let lastErr = null;
  for (const src of model.sources) {
    try {
      const res = await fetch(`https://huggingface.co/api/models/${src.repo}/tree/main?recursive=true`);
      if (!res.ok) throw new Error(`MODEL_NOT_FOUND (${src.repo}: ${res.status})`);
      const files = (await res.json()).filter(f => f.type === "file" && /\.gguf$/i.test(f.path) && !/mmproj/i.test(f.path));
      const pick = q => files.find(f => f.path.toUpperCase().includes(q));
      const file = src.quant ? pick(src.quant.toUpperCase()) : (pick("Q4_K_M") || pick("Q8_0"));
      if (!file) throw new Error(`MODEL_NOT_FOUND (${src.repo}: no ${src.quant || "GGUF"} file)`);
      const path = file.path.replace(/-\d{5}-of-(\d{5})\.gguf$/i, "-00001-of-$1.gguf");   // split model: first part
      const url = `https://huggingface.co/${src.repo}/resolve/main/${path}`;
      store.set("dido.url." + model.id, url);
      return url;
    } catch (e) {
      lastErr = e;
      if (e instanceof TypeError) break;   // offline: other sources won't work either
    }
  }
  throw lastErr || new Error("MODEL_NOT_FOUND");
}

async function isCached(url) {
  try {
    const cm = getCacheManager();
    const name = await cm.getNameFromURL(url);
    const size = await cm.getSize(name);
    if (size <= 0) return false;
    const meta = await cm.getMetadata(name);
    return !meta || !meta.originalSize || meta.originalSize === size;
  } catch { return false; }
}

const mb = n => Math.round(n / 1048576).toLocaleString();
const isNetErr = e => e instanceof TypeError || /fetch|network|download|MODEL_NOT_FOUND|load failed/i.test(String(e?.message || e));
const isAbort = e => e?.name === "AbortError";

async function loadModel(model) {
  loading++; updateControls();
  try {
    const wl = await loadLib();
    if (llm) { const old = llm; llm = null; llmModel = null; showHint(); try { await old.exit(); } catch {} }
    status(`Getting ${model.name} ready…`);
    const url = await resolveModelUrl(model);
    const modes = gpuBox.checked && navigator.gpu ? ["gpu", "cpu"] : ["cpu"];
    let lastErr = null;
    for (const mode of modes) {
      const w = new wl.Wllama(WASM_PATHS, {
        suppressNativeLog: true, allowOffline: true, cacheManager: getCacheManager(), logger: wl.LoggerWithoutDebug,
      });
      w.setCompat(COMPAT);
      loadAbort = new AbortController();
      try {
        await w.loadModelFromUrl(url, {
          n_ctx: N_CTX, ...(mode === "cpu" ? { n_gpu_layers: 0 } : {}), signal: loadAbort.signal,
          progressCallback: ({ loaded, total }) => {
            if (total && loaded < total) status(`Downloading ${model.name}… ${mb(loaded)} of ${mb(total)} MB`, loaded / total * 100);
            else status(`Starting ${model.name}…`);
          },
        });
        llm = w; llmModel = model.id; onGPU = mode === "gpu";
        store.set("dido.everLoaded", true);
        navigator.storage?.persist?.().catch(() => {});   // ask the browser to keep the saved model
        status(""); showHint();
        return w;
      } catch (e) {
        lastErr = e;
        try { await w.exit(); } catch {}
        if (isAbort(e) || isNetErr(e) || /quota|storage/i.test(String(e?.message || e))) break;
        if (mode === "gpu") {   // the GPU didn't work on this device: use the CPU from now on
          console.warn("GPU load failed, using the CPU", e);
          gpuBox.checked = false; store.set("dido.gpu", false);
          engineKey = wantedKey();   // this load now stands for the CPU setting
        }
      } finally { loadAbort = null; }
    }
    throw lastErr || new Error("Couldn't start the AI.");
  } finally { loading--; updateControls(); }
}

// Loads run one after another, never in parallel.
function getEngine() {
  const want = wantedKey();
  if (enginePromise && engineKey === want) return enginePromise;
  engineKey = want;
  const model = currentModel();
  const p = loadChain.then(() => loadModel(model));
  loadChain = p.catch(() => {});
  enginePromise = p;
  p.catch(() => { if (enginePromise === p) { enginePromise = null; engineKey = null; } });
  return p;
}

function resetEngine() {
  const old = llm;
  llm = null; llmModel = null; engineKey = null; enginePromise = null;
  if (old) old.exit().catch(() => {});
  showHint();
}

// If the chosen model is already saved on this device, get it ready right away.
async function preloadIfCached() {
  if (busy || !store.get("dido.everLoaded", false) || engineKey === wantedKey()) return;
  const url = store.get("dido.url." + currentModel().id, null);
  if (!url) return;
  try {
    await loadLib();
    if (await isCached(url)) await getEngine();
  } catch (e) { console.warn("Preload skipped:", e); status(""); }
}

function friendlyError(err) {
  const msg = String(err?.message || err);
  const tooOld = isApp
    ? "Your phone's web engine is too old to run the AI. Please update **Android System WebView** (and Chrome) from the Play Store, then reopen Dido."
    : "This browser can't run the AI. Please use the latest Chrome, Edge, Firefox or Safari.";
  if (msg === "NO_WASM") return tooOld;
  // llama.cpp fails a reply when the model outputs bytes that aren't valid text (wllama then reports a bad array length)
  if (/Invalid typed array length|invalid UTF-8|type_error/i.test(msg))
    return "The AI got mixed up and stopped. Please try again.";
  if (err?.type === "kv_cache_full" || /kv.?cache|context (size|window)|too long/i.test(msg))
    return "This chat is too long for the AI's memory. Please start a **New chat**.";
  if (/MODEL_NOT_FOUND/.test(msg))
    return "Couldn't find this model online right now. Please pick another model in the menu and try again.";
  if (err?.name === "QuotaExceededError" || /quota|storage/i.test(msg))
    return "Not enough free storage on this device to save the model. Free up some space or pick a smaller model (Qwen3 0.6B).";
  if (/memory|OOM|alloc|Aborted\(|RangeError|RuntimeError|unreachable/i.test(msg)) {
    resetEngine();
    return "Your device ran out of memory for this model. Pick a smaller one (Qwen3 0.6B) in the menu, or turn off the GPU option, and try again.";
  }
  if (/CompileError|BigInt|WebAssembly/i.test(msg)) return tooOld;
  if (isNetErr(err))
    return "Couldn't download the AI model. Check your internet connection and try again.";
  return msg;
}

// ---------- chats ----------
const save = () => { store.set("dido.chats", chats); store.set("dido.current", currentId); };
const current = () => chats.find(c => c.id === currentId);

// A new chat is only saved once its first message is sent, so the list never fills with empty chats.
function newChat() { currentId = null; save(); render(); }

const estTokens = s => {
  let ascii = 0, other = 0;
  for (const ch of s) ch.charCodeAt(0) < 128 ? ascii++ : other++;
  return Math.ceil(ascii / 3 + other * 1.5) + 8;
};

// The messages the model sees: newest first until the budget is used up; failed turns left out.
function contextFor(c) {
  const msgs = [];
  c.messages.forEach((m, i) => {
    if (m.error || (m.role === "user" && c.messages[i + 1]?.error)) return;
    msgs.push({ role: m.role, content: m.content });
  });
  const out = [];
  let used = 0;
  for (let i = msgs.length - 1; i >= 0; i--) {
    used += estTokens(msgs[i].content);
    if (used > HISTORY_BUDGET && out.length) break;
    out.unshift(msgs[i]);
  }
  while (out.length > 1 && out[0].role !== "user") out.shift();
  return out;
}

// ---------- rendering ----------
const closeSide = () => $("side").classList.remove("open");
window.didoBack = () => {   // Android back button: close the menu first
  if ($("side").classList.contains("open")) { closeSide(); return true; }
  return false;
};

function renderSidebar() {
  const box = $("chats");
  box.innerHTML = "";
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat-item" + (c.id === currentId ? " active" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = c.title;
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.title = "Delete chat"; x.setAttribute("aria-label", "Delete chat");
    x.onclick = e => {
      e.stopPropagation();
      chats = chats.filter(k => k.id !== c.id);
      if (currentId === c.id) currentId = chats[0]?.id ?? null;
      save(); render();
    };
    el.onclick = () => { currentId = c.id; save(); render(); closeSide(); };
    el.append(t, x);
    box.append(el);
  }
}

async function copyText(text) {
  if (window.DidoNative?.copy) { window.DidoNative.copy(text); return; }
  await navigator.clipboard.writeText(text);
}

function addMsg(m) {
  const el = document.createElement("div");
  el.className = "msg " + m.role + (m.error ? " error" : "");
  const b = document.createElement("div");
  b.className = "bubble";
  if (m.role === "user") b.textContent = m.content; else b.innerHTML = md(m.content);
  el.append(b);
  if (m.role === "assistant" && !m.error) {
    const meta = document.createElement("div");
    meta.className = "meta";
    const copy = document.createElement("button");
    copy.type = "button"; copy.textContent = "Copy";
    copy.onclick = async () => {
      try { await copyText(m.content); copy.textContent = "Copied ✓"; }
      catch { copy.textContent = "Couldn't copy"; }
      setTimeout(() => { copy.textContent = "Copy"; }, 1500);
    };
    meta.append(copy);
    if (m.note) { const n = document.createElement("span"); n.textContent = m.note; meta.append(n); }
    el.append(meta);
  }
  $("list").append(el);
}

function addLive() {
  const el = document.createElement("div");
  el.className = "msg assistant";
  const b = document.createElement("div");
  b.className = "bubble typing";
  b.innerHTML = live.text ? md(live.text) : "";
  el.append(b);
  $("list").append(el);
  live.el = b;
}

function paintLive() {
  if (!live?.el?.isConnected) return;
  const stick = nearBottom();
  live.el.innerHTML = md(live.text);
  if (stick) scroll();
}

function renderEmpty() {
  const list = $("list");
  list.innerHTML = `<div class="empty"><img src="icon.svg" alt=""><h1>Hi, I'm Dido 👋</h1>
    <div>Free AI chat that runs privately on your device.</div><div class="suggest"></div></div>`;
  const box = list.querySelector(".suggest");
  for (const q of ["Explain quantum computing simply", "Write a short poem about Chennai rain",
                   "Help me plan a 3-day study schedule", "Write a Python function to reverse a string"]) {
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = q;
    b.onclick = () => { $("input").value = q; send(); };
    box.append(b);
  }
}

function renderMessages() {
  const c = current();
  if (!c || !c.messages.length) return renderEmpty();
  $("list").innerHTML = "";
  for (const m of c.messages) addMsg(m);
  if (live && live.chatId === c.id) addLive();
  scroll();
}

const nearBottom = () => { const m = $("messages"); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; };
const scroll = () => { const m = $("messages"); m.scrollTop = m.scrollHeight; };
function render() { renderSidebar(); renderMessages(); }

function status(text, pct) {
  const s = $("status");
  if (!text) { s.innerHTML = ""; return; }
  s.innerHTML = "<div></div>" + (pct != null ? `<div class="bar"><div style="width:${pct}%"></div></div>` : "");
  s.firstChild.textContent = text;
}

function updateControls() {
  const btn = $("send");
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
  modelSel.disabled = gpuBox.disabled = busy || loading > 0;
  try { window.DidoNative?.keepAwake?.(busy || loading > 0); } catch {}   // keep the screen on while working
}

// ---------- send / stop ----------
async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || busy) return;
  let c = current();
  if (!c) {
    c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "New chat", messages: [] };
    chats.unshift(c); currentId = c.id;
  }
  c.messages.push({ role: "user", content: text });
  if (c.title === "New chat") c.title = text.replace(/\s+/g, " ").slice(0, 40);
  input.value = ""; autosize();
  busy = true; stopRequested = false; live = { chatId: c.id, text: "" };
  save(); render(); updateControls();

  let reply = "", finish = null, error = null;
  try {
    const eng = await getEngine();
    if (!stopRequested) {
      abortCtl = new AbortController();
      const model = MODELS.find(m => m.id === llmModel) || currentModel();
      const stream = await eng.createChatCompletion({
        stream: true, max_tokens: MAX_REPLY, temperature: 0.7, top_p: 0.8, top_k: 20,
        messages: [{ role: "system", content: SYSTEM }, ...contextFor(c)],
        abortSignal: abortCtl.signal,
        ...(model.qwen3 ? { chat_template_kwargs: { enable_thinking: false } } : {}),
      });
      for await (const chunk of stream) {
        const choice = chunk.choices?.[0];
        reply += choice?.delta?.content || "";
        if (choice?.finish_reason) finish = choice.finish_reason;
        live.text = visible(reply);
        paintLive();
      }
    }
  } catch (err) {
    if (!isAbort(err)) { console.error(err); error = friendlyError(err); }
  }
  abortCtl = null;
  status("");
  reply = visible(reply).trimEnd();

  const msg = { role: "assistant", content: reply };
  if (error && reply) msg.note = "Reply ended early.";   // keep the part that arrived
  else if (error) { msg.error = true; msg.content = "⚠️ " + error; }
  else if (stopRequested) {
    if (reply) msg.note = "Stopped";
    else { msg.error = true; msg.content = "_Stopped._"; }
  }
  else if (finish === "length") msg.note = "Reply cut short. Type “continue” for more.";
  else if (!reply) { msg.error = true; msg.content = "_No reply. Please try again._"; }
  c.messages.push(msg);
  live = null; busy = false;
  save(); updateControls();
  if (currentId === c.id) renderMessages(); else renderSidebar();
  if (!isPhone) input.focus();
}

function stop() {
  stopRequested = true;
  abortCtl?.abort();
  loadAbort?.abort();   // also cancels a model download
}

// ---------- events ----------
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => {
  // Enter sends on computers; on phones Enter makes a new line and you tap Send.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !isPhone) { e.preventDefault(); send(); }
});
$("form").onsubmit = e => { e.preventDefault(); busy ? stop() : send(); };
$("newChat").onclick = $("newChat2").onclick = () => { newChat(); closeSide(); if (!isPhone) $("input").focus(); };
$("menu").onclick = () => $("side").classList.add("open");
$("backdrop").onclick = closeSide;
$("clearAll").onclick = () => {
  if (!confirm("Delete all chats? This can't be undone.")) return;
  chats = []; currentId = null; save(); render();
};
$("clearModels").onclick = async () => {
  if (busy || loading) { alert("Please wait until Dido finishes what it's doing."); return; }
  if (!confirm("Delete the downloaded AI models from this device to free up space?\nThey will download again the next time you chat.")) return;
  try {
    await loadLib();
    resetEngine();
    await getCacheManager().clear();
    for (const m of MODELS) store.del("dido.url." + m.id);
    store.set("dido.everLoaded", false);
    status("Downloaded models deleted. Space freed.");
  } catch (e) { status("Couldn't delete the models: " + (e.message || e)); }
};

if (/[?&]restarted=1/.test(location.search))
  status("Dido restarted because the phone ran low on memory. If this keeps happening, pick Qwen3 0.6B in the menu.");
render();
showHint();
updateControls();
preloadIfCached();
</script>
</body>
</html>
